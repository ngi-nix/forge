# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
# https://github.com/orhun/git-cliff/blob/main/cliff.toml

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/docs/#introduction
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""

# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{% macro print_commit(commit) -%}
    - {% if commit.scope %}*{{ commit.scope }}:* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | split(pat="\n") | first | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))\
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]\
          (<REPO>/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | filter(attribute="merge_commit", value=false)
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits
    | filter(attribute="merge_commit", value=false) %}
        {%- if commit.scope -%}
        {% else -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
    {% raw %}\n{% endraw %}\
{% endfor %}\n
"""

# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/docs/#introduction
footer = """
<!-- generated by git-cliff -->
"""

# Remove leading and trailing whitespaces from the changelog's body.
trim = true

# An array of regex based postprocessors to modify the changelog.
postprocessors = [
  # Replace the placeholder `<REPO>` with a URL.
  { pattern = '<REPO>', replace = "https://github.com/ngi-nix/forge" }, # replace repository URL
]

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true

# Keep unconventional commits so they can be grouped under "Other".
filter_unconventional = false

# An array of regex based parsers to modify commit messages prior to further processing.
commit_preprocessors = [
  # Replace issue numbers with link templates to be updated in `changelog.postprocessors`.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
  # Normalize `±user@clarity(forge):` / `+dev@consistency(...):` style prefixes,
  # preserving meaningful scopes
  { pattern = '^[±+\-]\w+@\w+\(([^*)][^)]*)\): ', replace = "chore(${1}): " },
  # Same prefixes with `(*)` or no scope: drop the parens entirely
  { pattern = '^[±+\-]\w+@\w+(\(\*\))?: ', replace = "chore: " },
]

# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
commit_parsers = [
  { body = ".*security.*", group = "Security" },

  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI/CD" },

  { message = "^flake", group = "Flake" },
  { message = "^recipes", group = "Recipes" },
  { message = "^templates", group = "Templates" },
  { message = '^ui', group = "User Interface" },

  { message = '^\((.*)\):.*->.*', group = "(${1})" },

  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { message = "^treewide", group = "Miscellaneous Tasks" },
  { message = "^\\+[^ ]*@.*", group = "Miscellaneous Tasks" },
  { message = ".*", group = "Other" },
]

# Exclude commits that are not matched by any commit parser.
filter_commits = false

# Order releases topologically instead of chronologically.
topo_order = false

# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"

# Exclude tags from the abandoned `explore` branch (1.x series) so that
# compare links only reference real releases (0.x series).
ignore_tags = "^1\\."
