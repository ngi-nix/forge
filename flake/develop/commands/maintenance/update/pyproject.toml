[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-update"
version = "0.0.0"
description = "Update Forge packages to the latest upstream version"

[project.scripts]
forge-update = "forge_update.__main__:main"

[tool.setuptools]
packages = ["forge_update"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not contract and not integration'"
markers = [
  "contract: parses the repository's real recipes",
  "integration: needs network and/or nix",
  "git: needs a real git binary",
]
