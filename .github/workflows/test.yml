name: Test

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string

permissions: {}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # - name: Get more storage space
      #   uses: wimpysworld/nothing-but-nix@main

  lint:
    name: Run format checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ngi-forge

      - name: Run checks
        run: |
          nix build --accept-flake-config .#formatter.x86_64-linux
          ./result/bin/treefmt --ci

  build-preview-ui:
    name: Build UI artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '')

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Fetches the specific PR branch if manually dispatched, otherwise defaults to standard checkout
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', github.event.inputs.pr_number) || '' }}
          persist-credentials: false

      - name: Save PR context
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "${GITHUB_EVENT_INPUTS_PR_NUMBER}" > pr-number.txt
            git rev-parse HEAD > pr-rev.txt
          else
            echo "${{ github.event.pull_request.number }}" > pr-number.txt
            echo "${{ github.event.pull_request.head.sha }}" > pr-rev.txt
          fi
        env:
          GITHUB_EVENT_INPUTS_PR_NUMBER: ${{ github.event.inputs.pr_number }}

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      # NOTE: no auth token, so read-only. because we will not be pushing anything here
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ngi-forge

      # Main Forge UI
      - name: Encode version information
        run: |
          commit="${{ github.event.pull_request.head.sha || github.sha }}"
          commit=${commit:-master}
          sed -i "s/master/$commit/g" ui/src/Main/Config.elm

      - name: Build UI
        run: |
          PR_NUMBER=$(cat pr-number.txt)
          PR_REV=$(cat pr-rev.txt)

          for TARGET in "commit" "pr"; do
            if [ "$TARGET" = "commit" ]; then
              BASE_URL_FORGE="/${PR_REV}/forge/"
              BASE_URL_PROVIDER="/${PR_REV}/templates/provider/"
              OUT_DIR="deploy_dist_commit"
            else
              BASE_URL_FORGE="/pr-${PR_NUMBER}/forge/"
              BASE_URL_PROVIDER="/pr-${PR_NUMBER}/templates/provider/"
              OUT_DIR="deploy_dist_pr"
            fi

            # --- Forge UI ---
            git checkout -- ui/src/Main/Model/Route.elm ui/src/index.html
            sed -i "s|:baseUrl|$BASE_URL_FORGE|g" ui/src/Main/Model/Route.elm
            sed -i "s|<base href=\"/\"|<base href=\"$BASE_URL_FORGE\"|g" ui/src/index.html

            nix build .#_forge.ui --accept-flake-config
            mkdir -p $OUT_DIR/forge
            cp -rL result/. $OUT_DIR/forge/
            cp $OUT_DIR/forge/404.html $OUT_DIR/404.html

            # --- Provider UI ---
            git checkout -- ui/src/Main/Model/Route.elm ui/src/index.html

            rm -rf /tmp/template-provider
            mkdir -p /tmp/template-provider
            cd /tmp/template-provider
            git init -q
            nix flake init -t "${{ github.workspace }}#provider"
            sed -i 's|ngi-forge.url = .*;|ngi-forge.url = "path:${{ github.workspace }}";|g' flake.nix
            git add ./*

            pushd ${{ github.workspace }}
            sed -i "s|:baseUrl|$BASE_URL_PROVIDER|g" ui/src/Main/Model/Route.elm
            sed -i "s|<base href=\"/\"|<base href=\"$BASE_URL_PROVIDER\"|g" ui/src/index.html
            popd

            nix build .#_forge.ui --accept-flake-config
            mkdir -p ${{ github.workspace }}/$OUT_DIR/templates/provider
            cp -rL result/. ${{ github.workspace }}/$OUT_DIR/templates/provider/

            cd ${{ github.workspace }}
          done

      - name: Cache git-pages-cli
        id: cache-gpc
        uses: actions/cache@v4
        with:
          path: git-pages-cli
          key: git-pages-cli-static-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - name: Build static git-pages-cli
        if: steps.cache-gpc.outputs.cache-hit != 'true'
        run: |
          nix build --inputs-from . nixpkgs#pkgsStatic.git-pages-cli -o gpc-result
          cp gpc-result/bin/git-pages-cli ./git-pages-cli
          chmod +x ./git-pages-cli

      # Deployment
      - name: Upload preview UI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-build-preview
          path: |
            deploy_dist_commit/
            deploy_dist_pr/
            pr-number.txt
            pr-rev.txt
            git-pages-cli
          retention-days: 1
