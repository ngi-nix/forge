name: git-pages Deploy

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed

# prevents more than one run of this type at time for single pr.
# we can do it for this gha but not the tests workflow
# because for tests we don't want to lose valuable time spent building the derivations
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Push Preview to git-pages
    runs-on: ubuntu-latest
    permissions:
      deployments: write # deployments
      statuses: write # commit statuses
      pull-requests: write # pr comments
    if: >
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download PR artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-build-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR context
        run: |
          if [ -f pr-number.txt ]; then
            {
              echo "PR_NUMBER=$(cat pr-number.txt)"
              echo "PR_REV=$(cat pr-rev.txt)"
            } >>"$GITHUB_ENV"
          fi

      - name: Set Pending Status
        if: env.PR_REV != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PR_REV,
              state: 'pending',
              context: 'git-pages PR Preview',
              description: 'Deploying UI preview...',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Deploy to git-pages
        if: env.PR_NUMBER != ''
        env:
          GIT_PAGES_PASSWORD: ${{ secrets.GIT_PAGES_PASSWORD }}
        run: |
          PREVIEW_URL="https://dev.ngi.nixos.org"
          PREVIEW_URL_BASE="${PREVIEW_URL}/pr-${PR_NUMBER}"
          COMMIT_URL_BASE="${PREVIEW_URL}/${PR_REV}"

          chmod +x ./git-pages-cli

          # make each preview expire in 100 days
          ./git-pages-cli "$COMMIT_URL_BASE" --upload-dir deploy_dist_commit --expires 100
          ./git-pages-cli "$PREVIEW_URL_BASE" --upload-dir deploy_dist_pr --expires 100

          # Use the PR rev as the deploy ID for state tracking
          DEPLOY_ID="${PR_REV:0:7}"

          {
            echo "PREVIEW_URL=$PREVIEW_URL_BASE/forge"
            echo "EXAMPLES_URL=$PREVIEW_URL_BASE/templates/provider"
            echo "DEPLOY_URL=$COMMIT_URL_BASE/forge"
            echo "DEPLOY_ID=$DEPLOY_ID"
          } >>"$GITHUB_ENV"

      - name: Post PR Comment
        if: env.PR_NUMBER != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const previewUrl = process.env.PREVIEW_URL;
            const examplesUrl = process.env.EXAMPLES_URL;
            const deployUrl = process.env.DEPLOY_URL;

            const rev = process.env.PR_REV || 'unknown';
            const shortRev = rev.length >= 7 ? rev.substring(0, 7) : rev;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${rev}`;

            const time = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';

            const prDeployLine = `- Visit: ${previewUrl} (This url will not change for new commits in this pr)`;
            const currentDeployLine = `- Unique snapshot URL: ${deployUrl} _(for commit [${shortRev}](${commitUrl}))_`;
            const examplesDeployLine = `- Example apps: ${examplesUrl} (from _provider_ Flake template)`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.data.find(c => c.body && c.body.includes('UI Preview Deployed'));

            let pastDeploys = [];
            if (existingComment) {
              const stateMatch = existingComment.body.match(/<!--\n([\s\S]*?)\n-->/);
              if (stateMatch && stateMatch[1].trim()) {
                pastDeploys = stateMatch[1].trim().split('\n').filter(line => line.trim().startsWith('- '));
              }
            }

            const histCurrentDeployEntry = `- [${process.env.DEPLOY_ID}](${deployUrl}) ([${shortRev}](${commitUrl})) _${time}_`;
            const allDeployState = [histCurrentDeployEntry, ...pastDeploys];

            const messageBodyParts = [
              '🚀 **UI Preview Deployed**',
              '',
              prDeployLine,
              currentDeployLine,
              examplesDeployLine,
              ''
            ];

            if (pastDeploys.length > 0) {
              messageBodyParts.push(
                '<details><summary><b>Previous Deployments</b></summary>',
                '',
                ...pastDeploys,
                '</details>',
                ''
              );
            }

            messageBodyParts.push(
              '---',
              '**Note:** See the **checks** section at the bottom of this PR. Once the git-pages run is green, you can click **Details** to visit the deployment directly.',
              '',
              '<!--',
              ...allDeployState,
              '-->'
            );

            const messageBody = messageBodyParts.join('\n');

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: messageBody
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: messageBody
              });
            }

      - name: Set Success Status
        if: env.PR_REV != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PR_REV,
              state: 'success',
              context: 'git-pages PR Preview',
              description: 'Preview ready!',
              target_url: process.env.PREVIEW_URL
            });

      - name: Set Failure Status
        # Only runs if a previous step failed, ensuring the PR isn't stuck "pending"
        if: failure() && env.PR_REV != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PR_REV,
              state: 'error',
              context: 'git-pages PR Preview',
              description: 'Deployment failed. Click details for logs.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Create Native GitHub Deployment
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOY_JSON=$(cat <<EOF
          {
            "ref": "${PR_REV}",
            "environment": "Preview PR-${PR_NUMBER}",
            "description": "git-pages PR Preview",
            "transient_environment": true,
            "auto_merge": false,
            "required_contexts": []
          }
          EOF
          )

          DEPLOY_ID=$(echo "$DEPLOY_JSON" | gh api --method POST repos/${{ github.repository }}/deployments --input - --jq '.id')

          echo "Created Deployment ID: $DEPLOY_ID"

          gh api --method POST repos/${{ github.repository }}/deployments/"$DEPLOY_ID"/statuses \
            -f state="success" \
            -f environment_url="${DEPLOY_URL}" \
            -f description="Preview is ready!"
