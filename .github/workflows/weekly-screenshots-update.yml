name: Weekly application screenshots update

on:
  schedule:
    - cron: "0 3 * * 0" # Each Sunday 3am
  workflow_dispatch:

env:
  NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

jobs:
  update:
    name: Update application screenshots
    if: github.repository_owner == 'ngi-nix'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ngi-forge

      - name: Update screenshots
        run: nix develop --accept-flake-config --command forge-screenshots

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            recipes/apps/*/screenshots.nix
          title: "apps: automatic update of screenshots"
          body: |
            Update application screenshots from AppStream metainfo and Flathub with `forge-screenshots`.
            PR auto-generated by [create-pull-request][1].

            [1]: https://github.com/peter-evans/create-pull-request
          branch: screenshots-update-pr
          delete-branch: true
          commit-message: "apps: weekly screenshots update"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          # Token owner: https://github.com/imincik
          # Permissions:
          #   * Read access to metadata
          #   * Read and Write access to code and pull requests
          token: ${{ secrets.FLAKE_UPDATE }}
          labels: automated
